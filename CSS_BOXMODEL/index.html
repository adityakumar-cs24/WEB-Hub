<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Box Model</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box {
            background-color: aqua;
        }

        .box1 {
            color: red;
            margin: 25px;
            padding: 10px;
            border: 5px solid green;
            height: 200px;
            box-sizing: border-box;
        }

        .box2 {
            color: fuchsia;
            margin: 25px;
            padding: 10px;
            border: 5px solid red;
            height: 200px;
            box-sizing: border-box;
        }
        
    </style>
</head>
<body>
    <div class="box box1">
        I am a box.
    </div>

    <div class="box box2">
        I am also box.
    </div>
</body>
</html>
